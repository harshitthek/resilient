name: Submit verified PRs upstream

on:
  # Automated cron disabled: human approval is required before submitting PRs
  workflow_dispatch: {}      # manual trigger only (only submits approved fixes)

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements-submit.txt

      - name: Run submission pipeline
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.DISPATCH_GH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID || secrets.APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}
          REQUIRE_HUMAN_APPROVAL: "true"
        run: python scripts/submit.py
